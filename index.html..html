<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHO AM I? — Self Discovery and Personal Growth Platform</title>
<meta name="description" content="Discover Yourself. Understand Your Emotions. Grow Beyond Yourself.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>
<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root {
  --bg-primary:#FBF7F2; --bg-secondary:#FFFFFF; --bg-elevated:#FFFCF7;
  --bg-card:rgba(255,255,255,.75); --bg-card-hover:#FFFFFF;
  --border-soft:rgba(180,160,190,.18); --border-medium:rgba(180,160,190,.3);
  --text-primary:#3D3451; --text-secondary:#6B6178; --text-muted:#9A8FA8;
  --accent:#E8A87C; --accent-deep:#C77F52; --accent-soft:#FFE5D4; --accent-glow:rgba(232,168,124,.3);
  --lavender:#D4C5E8; --lavender-soft:#EDE5F5;
  --peach:#FFD4B8; --peach-soft:#FFECE0;
  --mint:#B8E0D2; --mint-soft:#DCF0E8;
  --pink:#F5C6D6; --pink-soft:#FCE5EC;
  --sky:#C5DCF0; --sky-soft:#E4EEF8;
  --cream:#F5DCA8; --cream-soft:#FBF0DB;
  --shadow-sm:0 2px 8px rgba(180,160,190,.08);
  --shadow-md:0 8px 24px rgba(180,160,190,.12);
  --shadow-lg:0 16px 48px rgba(180,160,190,.18);
  --shadow-colored:0 12px 32px var(--accent-glow);
  --font-display:'Fredoka','Varela Round','Comfortaa',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --radius-sm:12px; --radius-md:20px; --radius-lg:28px; --radius-xl:36px;
  --section-padding:clamp(3rem,8vw,6rem);
  --container-width:1200px;
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"] {
  --bg-primary:#1a1625; --bg-secondary:#231e30; --bg-elevated:#2a2438;
  --bg-card:rgba(255,255,255,.05); --bg-card-hover:rgba(255,255,255,.08);
  --border-soft:rgba(255,255,255,.1); --border-medium:rgba(255,255,255,.18);
  --text-primary:#F5EFF8; --text-secondary:#B8AFC5; --text-muted:#7A7088;
  --accent:#E8A87C; --accent-deep:#E8A87C; --accent-soft:rgba(232,168,124,.15); --accent-glow:rgba(232,168,124,.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,.2); --shadow-md:0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.4);
  --lavender-soft:rgba(212,197,232,.12); --peach-soft:rgba(255,212,184,.12);
  --mint-soft:rgba(184,224,210,.12); --pink-soft:rgba(245,198,214,.12);
  --sky-soft:rgba(197,220,240,.12); --cream-soft:rgba(245,220,168,.12);
}

/* ============================================================
   RESET & BASE
============================================================ */
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
body {
  font-family:var(--font-body); background:var(--bg-primary); color:var(--text-primary);
  line-height:1.7; overflow-x:hidden; font-weight:500;
  transition:background .4s, color .4s;
  min-height:100vh;
}
a { color:inherit; text-decoration:none; }
ul,ol { list-style:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea,select { font-family:inherit; }
img { max-width:100%; display:block; }
h1,h2,h3,h4,h5,h6 {
  font-family:var(--font-display); font-weight:600; line-height:1.25; letter-spacing:-.01em;
}
.container { width:100%; max-width:var(--container-width); margin:0 auto; padding:0 1.5rem; }

/* ============================================================
   SCROLL PROGRESS
============================================================ */
.scroll-progress {
  position:fixed; top:0; left:0; height:3px; width:0%;
  background:linear-gradient(90deg,var(--lavender),var(--pink),var(--peach),var(--cream));
  z-index:200; transition:width .1s linear;
}

/* ============================================================
   NAVBAR
============================================================ */
.navbar {
  position:fixed; top:1rem; left:50%; transform:translateX(-50%);
  width:calc(100% - 2rem); max-width:var(--container-width); z-index:100;
  padding:.85rem 1.5rem; display:flex; justify-content:space-between; align-items:center;
  background:rgba(255,252,247,.9); backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--border-soft); border-radius:100px;
  transition:box-shadow .3s, background .3s;
  box-shadow:var(--shadow-sm);
}
[data-theme="dark"] .navbar { background:rgba(35,30,48,.9); }
.navbar.scrolled { box-shadow:var(--shadow-md); }
.nav-logo {
  font-family:var(--font-display); font-weight:700; font-size:1.1rem;
  display:flex; align-items:center; gap:.5rem; flex-shrink:0;
}
.nav-logo em { font-style:normal; color:var(--accent-deep); }
.nav-logo-icon {
  width:32px; height:32px; border-radius:50%;
  background:linear-gradient(135deg,var(--lavender),var(--pink));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 12px rgba(212,197,232,.4); flex-shrink:0;
}
.nav-logo-icon svg { width:16px; height:16px; color:var(--text-primary); }
.nav-links { display:flex; gap:.25rem; align-items:center; }
.nav-links a {
  font-size:.82rem; font-weight:600; color:var(--text-secondary);
  transition:color .2s, background .2s;
  position:relative; padding:.4rem .7rem; border-radius:100px;
  white-space:nowrap;
}
.nav-links a:hover { color:var(--text-primary); background:var(--lavender-soft); }
.nav-links a.active { color:var(--accent-deep); background:var(--accent-soft); }
.nav-actions { display:flex; align-items:center; gap:.5rem; flex-shrink:0; }
.theme-toggle, .mobile-menu-btn {
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--lavender-soft); border:1px solid var(--border-soft);
  transition:transform .2s;
}
.theme-toggle:hover, .mobile-menu-btn:hover { transform:scale(1.06); }
.theme-toggle svg, .mobile-menu-btn svg { width:18px; height:18px; }
.mobile-menu-btn { display:none; }

.mobile-menu {
  position:fixed; top:5.5rem; left:1rem; right:1rem; z-index:99;
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1rem;
  display:flex; flex-direction:column; gap:.25rem;
  opacity:0; transform:translateY(-10px); pointer-events:none;
  transition:opacity .3s, transform .3s;
  box-shadow:var(--shadow-lg);
  max-height:calc(100vh - 7rem); overflow-y:auto;
}
.mobile-menu.open { opacity:1; transform:translateY(0); pointer-events:auto; }
.mobile-menu a {
  padding:.85rem 1rem; border-radius:var(--radius-sm);
  font-weight:600; font-size:.95rem; transition:background .2s;
  display:flex; align-items:center; gap:.6rem;
}
.mobile-menu a:hover, .mobile-menu a.active { background:var(--accent-soft); color:var(--accent-deep); }
.mobile-menu a svg { width:16px; height:16px; opacity:.7; }

/* ============================================================
   PAGES
============================================================ */
main { min-height:100vh; padding-top:0; }
.page { display:none; animation:fadeInPage .4s var(--ease-out-expo); }
.page.active { display:block; }
@keyframes fadeInPage { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

.page-header {
  padding:clamp(7rem,14vw,10rem) 0 clamp(2rem,4vw,3rem);
  text-align:center;
  background:radial-gradient(ellipse at 30% 20%, var(--lavender-soft) 0%, transparent 50%),
             radial-gradient(ellipse at 70% 30%, var(--peach-soft) 0%, transparent 50%),
             var(--bg-primary);
}
[data-theme="dark"] .page-header {
  background:radial-gradient(ellipse at 30% 20%, rgba(212,197,232,.1) 0%, transparent 50%),
             radial-gradient(ellipse at 70% 30%, rgba(255,212,184,.1) 0%, transparent 50%),
             var(--bg-primary);
}
.page-header .badge {
  display:inline-flex; align-items:center; gap:.4rem;
  padding:.4rem 1rem; background:var(--bg-secondary);
  border:1px solid var(--border-soft); border-radius:100px;
  font-size:.72rem; font-weight:700; color:var(--text-secondary);
  letter-spacing:.05em; text-transform:uppercase; margin-bottom:1.25rem;
  font-family:var(--font-display); box-shadow:var(--shadow-sm);
}
.page-header .badge svg { width:12px; height:12px; color:var(--accent-deep); }
.page-title {
  font-size:clamp(2.2rem,5vw,3.6rem); font-weight:700;
  letter-spacing:-.02em; line-height:1.15; margin-bottom:.75rem;
}
.page-subtitle {
  font-size:clamp(1rem,1.8vw,1.15rem); color:var(--accent-deep);
  font-weight:600; font-family:var(--font-display);
  font-style:italic; margin-bottom:1.25rem;
}
.page-desc {
  max-width:640px; margin:0 auto; color:var(--text-secondary);
  font-size:.98rem; line-height:1.75;
}

.section { padding:var(--section-padding) 0; }
.section-alt { background:var(--bg-secondary); }
.section-header { text-align:center; max-width:680px; margin:0 auto 2.5rem; }
.section-label {
  display:inline-flex; align-items:center; gap:.4rem;
  font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent-deep); margin-bottom:.75rem;
  padding:.32rem .9rem; background:var(--accent-soft); border-radius:100px;
  font-family:var(--font-display);
}
.section-label svg { width:11px; height:11px; }
.section-title { font-size:clamp(1.6rem,3.2vw,2.3rem); font-weight:600; margin-bottom:.75rem; line-height:1.2; }
.section-desc { color:var(--text-secondary); font-size:.95rem; line-height:1.7; }

/* ============================================================
   BUTTONS
============================================================ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  padding:.85rem 1.75rem; border-radius:100px;
  font-weight:700; font-size:.92rem; font-family:var(--font-display);
  transition:all .3s var(--ease-out-expo); border:1px solid transparent;
  cursor:pointer; letter-spacing:.01em;
}
.btn-primary { background:var(--accent); color:#fff; box-shadow:var(--shadow-colored); }
.btn-primary:hover { transform:translateY(-3px); box-shadow:0 16px 40px var(--accent-glow); }
.btn-secondary { background:var(--bg-secondary); border-color:var(--border-medium); color:var(--text-primary); box-shadow:var(--shadow-sm); }
.btn-secondary:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
.btn-ghost { background:transparent; color:var(--text-secondary); padding:.5rem 1rem; font-size:.85rem; }
.btn-ghost:hover { background:var(--lavender-soft); color:var(--text-primary); }
.btn-danger { background:#E8A8A8; color:#fff; }
.btn-danger:hover { background:#D99090; transform:translateY(-2px); }
.btn-sm { padding:.55rem 1.2rem; font-size:.82rem; }
.btn svg { width:16px; height:16px; }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none !important; }

/* ============================================================
   CARDS
============================================================ */
.card {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1.75rem;
  box-shadow:var(--shadow-sm); transition:all .3s var(--ease-out-expo);
}
.card:hover { box-shadow:var(--shadow-md); }
.card-tinted {
  background:color-mix(in srgb, var(--card-accent, var(--lavender)) 22%, white);
  border-color:color-mix(in srgb, var(--card-accent, var(--lavender)) 35%, transparent);
}
[data-theme="dark"] .card-tinted {
  background:color-mix(in srgb, var(--card-accent, var(--lavender)) 10%, var(--bg-secondary));
  border-color:color-mix(in srgb, var(--card-accent, var(--lavender)) 25%, transparent);
}
.card-icon-wrap {
  width:52px; height:52px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:var(--accent-soft); color:var(--accent-deep); margin-bottom:1rem;
}
.card-icon-wrap svg { width:24px; height:24px; }
.card h3 { font-size:1.15rem; font-weight:600; margin-bottom:.5rem; }
.card p { color:var(--text-secondary); font-size:.9rem; line-height:1.7; }

/* ============================================================
   FORMS
============================================================ */
.form-group { margin-bottom:1.15rem; }
.form-label {
  display:block; font-family:var(--font-display); font-weight:600;
  font-size:.85rem; color:var(--text-primary); margin-bottom:.4rem;
}
.form-label .hint { font-weight:500; color:var(--text-muted); font-size:.75rem; font-family:var(--font-body); margin-left:.35rem; }
.form-input, .form-select, .form-textarea {
  width:100%; padding:.8rem 1rem; border-radius:var(--radius-sm);
  background:var(--bg-elevated); border:1px solid var(--border-medium);
  color:var(--text-primary); font-size:.92rem;
  transition:border-color .2s, box-shadow .2s; font-weight:500;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);
}
.form-textarea { resize:vertical; min-height:100px; line-height:1.65; }
.form-select { cursor:pointer; }
::placeholder { color:var(--text-muted); font-weight:500; }

/* ============================================================
   HOME PAGE
============================================================ */
.hero-home {
  min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding:clamp(7rem,12vw,10rem) 0 4rem;
  position:relative; overflow:hidden;
  background:radial-gradient(ellipse at 20% 30%, var(--lavender-soft) 0%, transparent 50%),
             radial-gradient(ellipse at 80% 20%, var(--peach-soft) 0%, transparent 50%),
             radial-gradient(ellipse at 60% 80%, var(--mint-soft) 0%, transparent 50%),
             var(--bg-primary);
}
[data-theme="dark"] .hero-home {
  background:radial-gradient(ellipse at 20% 30%, rgba(212,197,232,.15) 0%, transparent 50%),
             radial-gradient(ellipse at 80% 20%, rgba(255,212,184,.12) 0%, transparent 50%),
             radial-gradient(ellipse at 60% 80%, rgba(184,224,210,.12) 0%, transparent 50%),
             var(--bg-primary);
}
.hero-home::before, .hero-home::after {
  content:''; position:absolute; border-radius:50%;
  filter:blur(80px); opacity:.5; pointer-events:none;
  animation:float 14s ease-in-out infinite;
}
.hero-home::before { width:420px; height:420px; background:var(--lavender); top:15%; left:-5%; }
.hero-home::after { width:360px; height:360px; background:var(--peach); bottom:10%; right:-3%; animation-delay:-7s; }
@keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,-40px) scale(1.08);} }

.hero-badge {
  display:inline-flex; align-items:center; gap:.5rem;
  padding:.5rem 1.1rem; background:var(--bg-secondary);
  border:1px solid var(--border-soft); border-radius:100px;
  font-size:.72rem; font-weight:700; color:var(--text-secondary);
  letter-spacing:.05em; text-transform:uppercase; margin-bottom:1.75rem;
  box-shadow:var(--shadow-sm); font-family:var(--font-display);
}
.hero-badge svg { width:13px; height:13px; color:var(--accent-deep); }
.hero-badge em { color:var(--accent-deep); font-style:normal; }
.hero-title {
  font-size:clamp(2.5rem,7vw,4.8rem); font-weight:700; letter-spacing:-.02em;
  line-height:1.08; margin-bottom:1.25rem; max-width:900px;
}
.hero-title .highlight { color:var(--accent-deep); position:relative; display:inline-block; }
.hero-title .highlight::after {
  content:''; position:absolute; bottom:.05em; left:0; width:100%; height:.2em;
  background:linear-gradient(90deg,var(--pink),var(--peach));
  opacity:.6; z-index:-1; transform:skewX(-12deg); border-radius:4px;
}
.hero-tagline {
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(1rem,2vw,1.25rem); color:var(--accent-deep);
  margin-bottom:1rem; letter-spacing:.01em;
  display:inline-flex; align-items:center; gap:.6rem;
  padding:.5rem 1.25rem; background:var(--accent-soft);
  border-radius:100px;
}
.hero-tagline svg { width:14px; height:14px; }
.hero-subtitle {
  font-size:clamp(.98rem,1.8vw,1.15rem); color:var(--text-secondary);
  max-width:640px; margin:0 auto 2.25rem; line-height:1.75;
}
.hero-actions { display:flex; gap:.85rem; flex-wrap:wrap; justify-content:center; }

/* Feature cards on home */
.feature-grid {
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:1.1rem; margin-top:2rem;
}
.feature-card {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1.5rem 1.35rem;
  display:flex; flex-direction:column; gap:.6rem;
  cursor:pointer; transition:all .35s var(--ease-out-expo);
  box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  text-align:left;
}
.feature-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-md); border-color:var(--accent); }
.feature-card.featured { grid-column:span 2; background:linear-gradient(135deg,var(--lavender-soft),var(--peach-soft)); border-color:var(--lavender); }
[data-theme="dark"] .feature-card.featured { background:linear-gradient(135deg,rgba(212,197,232,.12),rgba(255,212,184,.12)); }
.feature-card .fc-icon {
  width:46px; height:46px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft); color:var(--accent-deep); flex-shrink:0;
}
.feature-card:nth-child(2) .fc-icon { background:var(--peach-soft); color:#B8805C; }
.feature-card:nth-child(3) .fc-icon { background:var(--pink-soft); color:#C77E9D; }
.feature-card:nth-child(4) .fc-icon { background:var(--mint-soft); color:#5A9A82; }
.feature-card:nth-child(5) .fc-icon { background:var(--sky-soft); color:#5A85AD; }
.feature-card:nth-child(6) .fc-icon { background:var(--cream-soft); color:#B89547; }
.feature-card:nth-child(7) .fc-icon { background:var(--lavender-soft); color:#8B72B5; }
.feature-card .fc-icon svg { width:22px; height:22px; }
.feature-card h3 { font-size:1.05rem; font-weight:600; }
.feature-card p { font-size:.84rem; color:var(--text-secondary); line-height:1.6; flex-grow:1; }
.feature-card .fc-link {
  display:inline-flex; align-items:center; gap:.3rem;
  font-family:var(--font-display); font-size:.8rem; font-weight:700;
  color:var(--accent-deep); margin-top:.35rem; transition:gap .2s;
}
.feature-card:hover .fc-link { gap:.55rem; }
.feature-card .fc-link svg { width:13px; height:13px; }

/* ============================================================
   KENALI DIRI
============================================================ */
.info-grid {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
  gap:1.1rem;
}
.info-card {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1.5rem;
  box-shadow:var(--shadow-sm); transition:transform .3s;
}
.info-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-md); }
.info-card .ic-icon {
  width:44px; height:44px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center;
  background:var(--lavender-soft); color:#8B72B5; margin-bottom:.85rem;
}
.info-card:nth-child(2) .ic-icon { background:var(--peach-soft); color:#B8805C; }
.info-card:nth-child(3) .ic-icon { background:var(--mint-soft); color:#5A9A82; }
.info-card:nth-child(4) .ic-icon { background:var(--pink-soft); color:#C77E9D; }
.info-card .ic-icon svg { width:20px; height:20px; }
.info-card h4 { font-family:var(--font-display); font-size:1rem; font-weight:600; margin-bottom:.35rem; }
.info-card p { font-size:.85rem; color:var(--text-secondary); line-height:1.65; }

/* Reflection list */
.reflection-item {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-md); padding:1.25rem; margin-bottom:.85rem;
  box-shadow:var(--shadow-sm); transition:box-shadow .2s;
}
.reflection-item:hover { box-shadow:var(--shadow-md); }
.reflection-q { font-family:var(--font-display); font-weight:600; font-size:.95rem; color:var(--text-primary); margin-bottom:.5rem; display:flex; align-items:flex-start; gap:.5rem; }
.reflection-q .rq-num {
  width:26px; height:26px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent-deep); font-size:.75rem;
  display:inline-flex; align-items:center; justify-content:center;
  flex-shrink:0; font-weight:700;
}
.reflection-input {
  width:100%; padding:.7rem .9rem; border-radius:var(--radius-sm);
  background:var(--bg-elevated); border:1px solid var(--border-medium);
  color:var(--text-primary); font-size:.88rem;
  transition:border-color .2s; font-weight:500;
  min-height:70px; resize:vertical; line-height:1.6;
}
.reflection-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.reflection-saved {
  font-size:.78rem; color:var(--mint); font-weight:600;
  margin-top:.4rem; display:flex; align-items:center; gap:.3rem;
}
.reflection-saved svg { width:12px; height:12px; }

/* Quiz interface */
.quiz-card {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:clamp(1.5rem, 3vw, 2.5rem);
  box-shadow:var(--shadow-md); max-width:640px; margin:0 auto;
}
.quiz-progress { height:8px; background:var(--lavender-soft); border-radius:100px; overflow:hidden; margin-bottom:1rem; }
.quiz-progress-bar { height:100%; background:linear-gradient(90deg,var(--lavender),var(--pink)); border-radius:100px; transition:width .4s var(--ease-out-expo); }
.quiz-counter { font-family:var(--font-display); font-size:.82rem; color:var(--text-muted); margin-bottom:.75rem; font-weight:600; }
.quiz-q { font-size:1.15rem; font-weight:600; margin-bottom:1.5rem; line-height:1.5; font-family:var(--font-display); }
.quiz-options { display:flex; flex-direction:column; gap:.7rem; }
.quiz-option {
  text-align:left; padding:1rem 1.25rem; border-radius:var(--radius-sm);
  background:var(--lavender-soft); border:1.5px solid transparent;
  font-size:.9rem; line-height:1.55; transition:all .2s; font-weight:500;
}
.quiz-option:hover { background:var(--peach-soft); border-color:var(--accent); transform:translateX(4px); }

.quiz-result-hero {
  text-align:center; padding:1.5rem 0;
}
.quiz-result-emoji { font-size:4rem; margin-bottom:.75rem; line-height:1; }
.quiz-result-title { font-family:var(--font-display); font-size:1.75rem; font-weight:700; margin-bottom:.75rem; }
.quiz-result-desc { font-size:.95rem; color:var(--text-secondary); line-height:1.75; margin-bottom:1.5rem; max-width:480px; margin-left:auto; margin-right:auto; }
.result-section { margin-top:1.5rem; text-align:left; }
.result-section h4 {
  font-family:var(--font-display); font-size:.85rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.08em; color:var(--accent-deep);
  margin-bottom:.65rem; display:flex; align-items:center; gap:.4rem;
}
.result-section h4 svg { width:14px; height:14px; }
.result-list li {
  font-size:.9rem; padding-left:1.5rem; position:relative;
  color:var(--text-secondary); margin-bottom:.5rem; line-height:1.6;
}
.result-list li::before {
  content:''; position:absolute; left:.25rem; top:.55rem;
  width:6px; height:6px; border-radius:50%; background:var(--accent);
}
.quiz-disclaimer {
  font-size:.8rem; color:var(--text-muted); font-style:italic;
  padding:1rem; background:var(--cream-soft); border-radius:var(--radius-sm);
  border-left:3px solid var(--cream); margin-top:1.5rem; line-height:1.6;
}

/* ============================================================
   RUANG EMOSI
============================================================ */
.mood-picker-grid {
  display:grid; grid-template-columns:repeat(5, 1fr);
  gap:.6rem; margin-bottom:1.5rem;
}
@media (max-width:640px) {
  .mood-picker-grid { grid-template-columns:repeat(3, 1fr); }
}
.mood-btn {
  display:flex; flex-direction:column; align-items:center; gap:.35rem;
  padding:.9rem .5rem; border-radius:var(--radius-md);
  background:var(--bg-elevated); border:2px solid transparent;
  transition:all .25s var(--ease-out-expo); cursor:pointer;
}
.mood-btn:hover { transform:translateY(-3px); border-color:var(--mood-color); }
.mood-btn.active {
  border-color:var(--mood-color);
  background:color-mix(in srgb, var(--mood-color) 25%, white);
  box-shadow:0 4px 16px color-mix(in srgb, var(--mood-color) 40%, transparent);
}
[data-theme="dark"] .mood-btn.active { background:color-mix(in srgb, var(--mood-color) 20%, var(--bg-secondary)); }
.mood-btn .me { font-size:1.75rem; line-height:1; }
.mood-btn .ml { font-family:var(--font-display); font-size:.7rem; font-weight:600; color:var(--text-secondary); }

.mood-step {
  padding:1.5rem; background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin-bottom:1.25rem;
}
.mood-step-num {
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%;
  background:var(--accent); color:#fff; font-family:var(--font-display);
  font-size:.78rem; font-weight:700; margin-right:.5rem;
}
.mood-step-title {
  font-family:var(--font-display); font-size:1rem; font-weight:600;
  margin-bottom:1rem; display:flex; align-items:center;
}

.mood-today-card {
  background:linear-gradient(135deg,var(--lavender-soft),var(--peach-soft));
  border:1px solid var(--lavender); border-radius:var(--radius-lg);
  padding:1.5rem; margin-bottom:1.5rem;
}
[data-theme="dark"] .mood-today-card { background:linear-gradient(135deg,rgba(212,197,232,.12),rgba(255,212,184,.12)); border-color:rgba(212,197,232,.3); }
.mood-today-head { display:flex; align-items:center; gap:.75rem; margin-bottom:.85rem; }
.mood-today-emoji { font-size:2.25rem; }
.mood-today-label { font-family:var(--font-display); font-weight:700; font-size:1.15rem; }
.mood-today-date { font-size:.8rem; color:var(--text-muted); font-weight:600; }
.mood-today-reason {
  font-size:.9rem; color:var(--text-secondary); line-height:1.7;
  padding:.85rem 1rem; background:var(--bg-secondary); border-radius:var(--radius-sm);
  margin-bottom:.85rem;
}
.mood-today-actions { display:flex; gap:.5rem; flex-wrap:wrap; }

/* Mood entries list */
.mood-entries-list { display:flex; flex-direction:column; gap:.75rem; }
.mood-entry {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-md); padding:1rem 1.15rem;
  display:flex; align-items:flex-start; gap:.85rem;
  transition:box-shadow .2s;
}
.mood-entry:hover { box-shadow:var(--shadow-md); }
.mood-entry-emoji { font-size:1.75rem; line-height:1; flex-shrink:0; }
.mood-entry-body { flex:1; min-width:0; }
.mood-entry-head { display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.25rem; flex-wrap:wrap; }
.mood-entry-name { font-family:var(--font-display); font-weight:700; font-size:.95rem; }
.mood-entry-time { font-size:.72rem; color:var(--text-muted); font-weight:600; }
.mood-entry-reason { font-size:.85rem; color:var(--text-secondary); line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.mood-entry-actions { display:flex; gap:.25rem; margin-top:.5rem; }
.mood-entry-actions button {
  font-size:.75rem; color:var(--text-muted); padding:.3rem .6rem;
  border-radius:6px; transition:all .2s; font-weight:600;
  display:flex; align-items:center; gap:.25rem;
}
.mood-entry-actions button:hover { background:var(--lavender-soft); color:var(--accent-deep); }
.mood-entry-actions button svg { width:11px; height:11px; }

/* Mood calendar */
.mood-calendar {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1.25rem; box-shadow:var(--shadow-sm);
}
.calendar-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:1rem; gap:.5rem;
}
.calendar-month {
  font-family:var(--font-display); font-weight:700; font-size:1rem;
}
.calendar-nav {
  width:32px; height:32px; border-radius:50%;
  background:var(--lavender-soft); border:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:center;
  transition:transform .2s; flex-shrink:0;
}
.calendar-nav:hover { transform:scale(1.08); }
.calendar-nav svg { width:14px; height:14px; }
.calendar-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:.35rem; }
.calendar-day-label {
  font-size:.68rem; color:var(--text-muted); font-weight:700;
  text-align:center; padding:.35rem 0; text-transform:uppercase;
  font-family:var(--font-display);
}
.calendar-day {
  aspect-ratio:1; border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  font-size:.78rem; font-weight:600; color:var(--text-muted);
  position:relative; cursor:pointer;
  transition:all .2s; background:var(--bg-elevated);
}
.calendar-day.empty { background:transparent; cursor:default; }
.calendar-day.has-mood {
  color:#fff; font-weight:700; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.calendar-day.has-mood:hover { transform:scale(1.08); z-index:1; }
.calendar-day.today { outline:2px solid var(--accent); outline-offset:1px; }
.calendar-day.today::after {
  content:''; position:absolute; bottom:3px; width:4px; height:4px;
  border-radius:50%; background:var(--accent);
}
.calendar-day.has-mood.today::after { background:#fff; }

/* Mood chart */
.mood-chart-wrap {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1.25rem; box-shadow:var(--shadow-sm);
}
.mood-chart {
  display:flex; align-items:flex-end; gap:4px;
  height:140px; padding:0 0 1.5rem; position:relative;
}
.mood-bar-wrap {
  flex:1; height:100%; display:flex; flex-direction:column;
  justify-content:flex-end; align-items:center; position:relative;
  min-width:8px;
}
.mood-bar {
  width:100%; border-radius:4px 4px 0 0; min-height:3px;
  transition:height .4s var(--ease-out-expo);
}
.mood-bar-day {
  position:absolute; bottom:-1.2rem;
  font-size:.6rem; color:var(--text-muted); font-weight:600;
}

/* Emotion guide */
.guide-grid {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:1rem;
}
.guide-card {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1.35rem;
  box-shadow:var(--shadow-sm); transition:transform .3s;
}
.guide-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-md); }
.guide-card .gc-icon {
  width:42px; height:42px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center;
  background:var(--mint-soft); color:#5A9A82; margin-bottom:.75rem;
}
.guide-card:nth-child(2) .gc-icon { background:var(--sky-soft); color:#5A85AD; }
.guide-card:nth-child(3) .gc-icon { background:var(--pink-soft); color:#C77E9D; }
.guide-card:nth-child(4) .gc-icon { background:var(--peach-soft); color:#B8805C; }
.guide-card:nth-child(5) .gc-icon { background:var(--lavender-soft); color:#8B72B5; }
.guide-card .gc-icon svg { width:20px; height:20px; }
.guide-card h4 { font-family:var(--font-display); font-weight:600; font-size:.95rem; margin-bottom:.35rem; }
.guide-card p { font-size:.83rem; color:var(--text-secondary); line-height:1.65; }

/* ============================================================
   JURNAL
============================================================ */
.journal-tabs {
  display:flex; gap:.35rem; padding:.35rem;
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:100px; margin-bottom:1.5rem;
  width:fit-content; box-shadow:var(--shadow-sm);
  max-width:100%; overflow-x:auto;
}
.journal-tab {
  padding:.55rem 1.15rem; border-radius:100px;
  font-family:var(--font-display); font-size:.82rem; font-weight:600;
  color:var(--text-secondary); transition:all .2s; white-space:nowrap;
  display:flex; align-items:center; gap:.35rem;
}
.journal-tab svg { width:14px; height:14px; }
.journal-tab.active { background:var(--accent); color:#fff; box-shadow:0 4px 12px var(--accent-glow); }
.journal-tab:not(.active):hover { background:var(--lavender-soft); }

.journal-list { display:flex; flex-direction:column; gap:.85rem; }
.journal-card {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-md); padding:1.25rem;
  box-shadow:var(--shadow-sm); transition:all .2s;
}
.journal-card:hover { box-shadow:var(--shadow-md); }
.journal-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:.75rem; margin-bottom:.35rem; }
.journal-card h4 { font-size:.98rem; font-weight:600; font-family:var(--font-display); line-height:1.4; flex:1; }
.journal-card-date { font-size:.72rem; color:var(--text-muted); font-weight:600; margin-bottom:.6rem; display:flex; align-items:center; gap:.4rem; }
.journal-card-date svg { width:12px; height:12px; }
.journal-card-text { font-size:.88rem; color:var(--text-secondary); line-height:1.7; white-space:pre-wrap; word-break:break-word; }
.journal-card-actions { display:flex; gap:.4rem; margin-top:.75rem; }
.journal-card-actions button {
  font-size:.75rem; padding:.35rem .75rem; border-radius:100px;
  background:var(--lavender-soft); color:var(--text-secondary);
  font-weight:600; transition:all .2s; display:flex; align-items:center; gap:.3rem;
}
.journal-card-actions button:hover { background:var(--peach-soft); color:var(--accent-deep); }
.journal-card-actions button.del:hover { background:rgba(232,168,168,.3); color:#B04545; }
.journal-card-actions button svg { width:12px; height:12px; }

.prompt-chips {
  display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.85rem;
}
.prompt-chip {
  font-size:.78rem; padding:.4rem .85rem; border-radius:100px;
  background:var(--lavender-soft); color:var(--text-secondary);
  border:1px solid transparent; transition:all .2s; cursor:pointer;
  font-weight:600; text-align:left;
}
.prompt-chip:hover { background:var(--peach-soft); color:var(--accent-deep); border-color:var(--peach); }

.gratitude-item {
  display:flex; align-items:flex-start; gap:.6rem; margin-bottom:.6rem;
}
.gratitude-num {
  width:28px; height:28px; border-radius:50%;
  background:var(--pink-soft); color:#C77E9D;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:.8rem;
  flex-shrink:0; margin-top:.35rem;
}
.gratitude-item input {
  flex:1; padding:.65rem .9rem; border-radius:var(--radius-sm);
  background:var(--bg-elevated); border:1px solid var(--border-medium);
  color:var(--text-primary); font-size:.88rem; font-weight:500;
}
.gratitude-item input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }

/* ============================================================
   TUMBUH
============================================================ */
.stats-grid {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  gap:1rem; margin-bottom:2rem;
}
.stat-card {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:1.25rem; text-align:center;
  box-shadow:var(--shadow-sm);
}
.stat-card .sc-icon {
  width:44px; height:44px; border-radius:50%;
  background:var(--lavender-soft); color:#8B72B5;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto .65rem;
}
.stat-card:nth-child(2) .sc-icon { background:var(--mint-soft); color:#5A9A82; }
.stat-card:nth-child(3) .sc-icon { background:var(--peach-soft); color:#B8805C; }
.stat-card:nth-child(4) .sc-icon { background:var(--pink-soft); color:#C77E9D; }
.stat-card .sc-icon svg { width:20px; height:20px; }
.stat-card .sc-value {
  font-family:var(--font-display); font-size:1.75rem; font-weight:700;
  line-height:1; color:var(--text-primary);
}
.stat-card .sc-label {
  font-size:.75rem; color:var(--text-muted); font-weight:600;
  text-transform:uppercase; letter-spacing:.05em; margin-top:.35rem;
}

.goal-item {
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-md); padding:1rem 1.15rem;
  display:flex; align-items:flex-start; gap:.75rem;
  transition:all .2s; box-shadow:var(--shadow-sm);
}
.goal-item:hover { box-shadow:var(--shadow-md); }
.goal-item.done { opacity:.7; }
.goal-item input[type="checkbox"] {
  width:20px; height:20px; accent-color:var(--accent);
  cursor:pointer; flex-shrink:0; margin-top:.15rem;
}
.goal-body { flex:1; min-width:0; }
.goal-body h4 {
  font-family:var(--font-display); font-size:.95rem; font-weight:600;
  line-height:1.4; margin-bottom:.25rem;
}
.goal-item.done .goal-body h4 { text-decoration:line-through; color:var(--text-muted); }
.goal-meta {
  display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.35rem;
  font-size:.72rem; color:var(--text-muted); font-weight:600;
}
.goal-badge {
  padding:.15rem .55rem; border-radius:100px;
  background:var(--lavender-soft); color:#8B72B5;
}
.goal-body p { font-size:.83rem; color:var(--text-secondary); line-height:1.55; }
.goal-actions { display:flex; gap:.3rem; flex-shrink:0; }
.goal-actions button {
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; color:var(--text-muted);
}
.goal-actions button:hover { background:var(--lavender-soft); color:var(--accent-deep); }
.goal-actions button.del:hover { background:rgba(232,168,168,.3); color:#B04545; }
.goal-actions button svg { width:13px; height:13px; }

.challenge-section { margin-bottom:2rem; }
.challenge-cat-title {
  font-family:var(--font-display); font-weight:700; font-size:.95rem;
  margin-bottom:.75rem; display:flex; align-items:center; gap:.5rem;
  color:var(--text-primary);
}
.challenge-cat-title svg { width:16px; height:16px; color:var(--accent-deep); }
.challenge-list { display:flex; flex-direction:column; gap:.5rem; }
.challenge-item {
  display:flex; align-items:center; gap:.75rem;
  padding:.75rem 1rem; background:var(--bg-secondary);
  border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  transition:all .2s;
}
.challenge-item:hover { border-color:var(--accent); }
.challenge-item input[type="checkbox"] {
  width:18px; height:18px; accent-color:var(--accent);
  cursor:pointer; flex-shrink:0;
}
.challenge-item label {
  flex:1; font-size:.85rem; font-weight:500; cursor:pointer;
  line-height:1.5;
}
.challenge-item.done label { text-decoration:line-through; color:var(--text-muted); }
.challenge-item.done { background:var(--mint-soft); border-color:var(--mint); }

.progress-bar-lg {
  height:12px; background:var(--lavender-soft); border-radius:100px;
  overflow:hidden; margin:.5rem 0;
}
.progress-bar-lg-fill {
  height:100%; background:linear-gradient(90deg,var(--mint),var(--sky));
  border-radius:100px; transition:width .5s var(--ease-out-expo);
}

/* ============================================================
   PLAY & LEARN
============================================================ */
.game-tabs {
  display:flex; gap:.4rem; margin-bottom:1.5rem;
  padding:.35rem; background:var(--bg-secondary);
  border:1px solid var(--border-soft); border-radius:100px;
  width:fit-content; box-shadow:var(--shadow-sm);
  max-width:100%; overflow-x:auto;
}
.game-tab {
  padding:.6rem 1.1rem; border-radius:100px;
  font-family:var(--font-display); font-size:.82rem; font-weight:600;
  color:var(--text-secondary); transition:all .2s; white-space:nowrap;
  display:flex; align-items:center; gap:.35rem;
}
.game-tab svg { width:14px; height:14px; }
.game-tab.active { background:var(--accent); color:#fff; box-shadow:0 4px 12px var(--accent-glow); }
.game-tab:not(.active):hover { background:var(--lavender-soft); }

.game-panel { display:none; }
.game-panel.active { display:block; }

/* Memory game */
.memory-diff-select { display:grid; grid-template-columns:repeat(3, 1fr); gap:.85rem; margin-bottom:1.5rem; }
@media (max-width:640px) { .memory-diff-select { grid-template-columns:1fr; } }
.memory-diff-card {
  padding:1.15rem; border-radius:var(--radius-md);
  background:var(--bg-secondary); border:2px solid var(--border-soft);
  cursor:pointer; transition:all .25s var(--ease-out-expo);
  text-align:left; display:flex; flex-direction:column; gap:.35rem;
  box-shadow:var(--shadow-sm);
}
.memory-diff-card:nth-child(1) { border-color:var(--mint); background:var(--mint-soft); }
.memory-diff-card:nth-child(2) { border-color:var(--sky); background:var(--sky-soft); }
.memory-diff-card:nth-child(3) { border-color:var(--pink); background:var(--pink-soft); }
.memory-diff-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
.memory-diff-card .md-title { font-family:var(--font-display); font-weight:700; font-size:1rem; }
.memory-diff-card .md-meta { font-size:.75rem; color:var(--text-muted); font-weight:600; }
.memory-diff-card .md-best { font-size:.78rem; color:var(--accent-deep); font-weight:700; font-family:var(--font-display); margin-top:.25rem; }

.memory-stats {
  display:grid; grid-template-columns:repeat(3, 1fr); gap:.5rem;
  margin-bottom:1rem;
}
.memory-stat {
  text-align:center; padding:.65rem .25rem;
  background:var(--bg-secondary); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
}
.memory-stat:nth-child(2) { background:var(--peach-soft); }
.memory-stat:nth-child(3) { background:var(--mint-soft); }
.memory-stat .ms-label {
  font-family:var(--font-display); font-size:.65rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);
  margin-bottom:.15rem;
}
.memory-stat .ms-val {
  font-family:var(--font-display); font-size:1.1rem; font-weight:700;
  color:var(--text-primary); font-variant-numeric:tabular-nums;
}

.memory-grid {
  display:grid; grid-template-columns:repeat(var(--cols,4),1fr);
  gap:.5rem; margin-bottom:1rem; perspective:1000px;
}

function migrateData() {
  // Mood: { "2025-11-24": 5 } → [{ id, date, time, mood, reason, extra }]
  const oldMood = storage.get('mood', null);
  if (oldMood && !storage.get('moods_v2', null)) {
    const map = { 1: 'sedih', 2: 'cemas', 3: 'biasa', 4: 'tenang', 5: 'senang' };
    const arr = Object.entries(oldMood).map(([date, lvl]) => ({
      id: Date.now() + Math.random(),
      date, time: new Date(date + 'T12:00:00').getTime(),
      mood: map[lvl] || 'biasa', reason: '', extra: {}
    }));
    storage.set('moods_v2', arr);
  }
  // Journal: { id, title, text, date } → { id, title, text, date, type: 'daily' }
  const oldJournal = storage.get('journal', null);
  if (oldJournal && !storage.get('journals_v2', null)) {
    storage.set('journals_v2', oldJournal.map(e => ({ ...e, type: 'daily' })));
  }
  // Goals: { id, text, done } → { id, name, desc, category, dueDate, done, createdAt }
  const oldGoals = storage.get('goals', null);
  if (oldGoals && !storage.get('goals_v2', null)) {
    storage.set('goals_v2', oldGoals.map(g => ({
      id: g.id, name: g.text, desc: '', category: 'Lainnya',
      dueDate: null, done: !!g.done, createdAt: g.id
    })));
  }
  // Quiz: { key, date } → { key, answers, timestamp }
  const oldQuiz = storage.get('lastQuiz', null);
  if (oldQuiz && !storage.get('quizResult_v2', null)) {
    storage.set('quizResult_v2', { key: oldQuiz.key, answers: [], timestamp: oldQuiz.date || Date.now() });
  }
}

function onRouteChange() {
  cleanupCurrentPage();
  const route = getRoute();
  $$('.page').forEach(p => { p.classList.remove('active'); p.innerHTML = ''; });
  const el = document.getElementById('page-' + route);
  el.innerHTML = pageRenderers[route]();
  requestAnimationFrame(() => {
    el.classList.add('active');
    el.querySelectorAll('.reveal').forEach(r => r.classList.add('visible'));
    feather.replace();
    pageAfterRender[route]?.();
  });
  $$('[data-route]').forEach(a => a.classList.toggle('active', a.dataset.route === route));
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function afterKenaliDiri() {
  // Reflection autosave
  $$('[data-ref-q]').forEach(textarea => {
    textarea.addEventListener('input', () => {
      const idx = textarea.dataset.refQ;
      const answers = storage.get('reflections_v2', {});
      answers[idx] = textarea.value;
      storage.set('reflections_v2', answers);
      const saved = $(`[data-ref-saved="${idx}"]`);
      if (saved) {
        saved.classList.remove('hidden');
        clearTimeout(saved._t);
        saved._t = setTimeout(() => saved.classList.add('hidden'), 1500);
      }
    });
  });

  // Quiz
  const startBtn = $('#quiz-start-btn');
  if (startBtn) startBtn.addEventListener('click', startQuiz);
  const retakeBtn = $('#quiz-retake-btn');
  if (retakeBtn) retakeBtn.addEventListener('click', startQuiz);

  function startQuiz() {
    state.quizIndex = 0;
    state.quizAnswers = [];
    renderQuizStep();
  }
  function renderQuizStep() {
    const container = $('#quiz-container');
    if (!container) return;
    container.innerHTML = renderQuizQuestionView();
    feather.replace();
    $$('.quiz-option').forEach(btn => {
      btn.addEventListener('click', () => {
        state.quizAnswers.push(btn.dataset.answer);
        state.quizIndex++;
        if (state.quizIndex < QUIZ_QUESTIONS.length) {
          renderQuizStep();
        } else {
          const countA = state.quizAnswers.filter(a => a === 'A').length;
          const key = countA >= 4 ? 'analyst' : countA >= 2 ? 'balanced' : 'explorer';
          const result = { key, answers: state.quizAnswers, timestamp: Date.now() };
          storage.set('quizResult_v2', result);
          container.innerHTML = renderQuizResultView(result);
          feather.replace();
          const retake = $('#quiz-retake-btn');
          if (retake) retake.addEventListener('click', startQuiz);
          toast('Hasil kuis tersimpan ✨');
        }
      });
    });
  }
}

function renderMoodHistory() {
  const moods = getMoods();
  if (moods.length === 0) {
    return `
      <div class="empty-state">
        <span class="es-icon">📔</span>
        <p>Belum ada catatan mood. Mulai catat suasana hatimu hari ini di atas.</p>
      </div>
    `;
  }
  // Calendar
  const y = state.calendarYear;
  const m = state.calendarMonth;
  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0);
  const startDow = (firstDay.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = lastDay.getDate();
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const dowLabels = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];

  // Entries by date
  const byDate = {};
  moods.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  const calendarHtml = `
    <div class="mood-calendar">
      <div class="calendar-header">
        <button class="calendar-nav" data-cal-prev><i data-feather="chevron-left"></i></button>
        <div class="calendar-month">${monthNames[m]} ${y}</div>
        <button class="calendar-nav" data-cal-next><i data-feather="chevron-right"></i></button>
      </div>
      <div class="calendar-grid">
        ${dowLabels.map(d => `<div class="calendar-day-label">${d}</div>`).join('')}
        ${Array(startDow).fill('').map(() => '<div class="calendar-day empty"></div>').join('')}
        ${Array.from({length: daysInMonth}, (_, i) => {
          const d = i + 1;
          const dk = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const entries = byDate[dk];
          const latest = entries ? entries.sort((a,b) => b.time - a.time)[0] : null;
          const moodInfo = latest ? getMood(latest.mood) : null;
          const isToday = dk === dateKey(new Date());
          return `<button class="calendar-day ${entries ? 'has-mood' : ''} ${isToday ? 'today' : ''}"
                          ${moodInfo ? `style="background:${moodInfo.color};"` : ''}
                          data-cal-date="${dk}"
                          title="${entries ? entries.length + ' catatan' : 'Tidak ada catatan'}">${d}</button>`;
        }).join('')}
      </div>
    </div>
  `;

  // Chart (14 days)
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push({ key: dateKey(d), date: d });
  }
  const chartHtml = `
    <div class="mood-chart-wrap">
      <h4 style="font-family:var(--font-display);font-weight:700;font-size:.95rem;margin-bottom:.75rem;">14 Hari Terakhir</h4>
      <div class="mood-chart">
        ${days.map(d => {
          const entries = byDate[d.key];
          const latest = entries ? entries.sort((a,b) => b.time - a.time)[0] : null;
          const mood = latest ? getMood(latest.mood) : null;
          const heights = { 'senang':100, 'bersyukur':100, 'tenang':80, 'biasa':60, 'lelah':40, 'cemas':40, 'sedih':30, 'marah':30, 'kecewa':30 };
          const h = latest ? (heights[latest.mood] || 50) : 0;
          return `<div class="mood-bar-wrap" title="${d.date.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}${mood ? ': ' + mood.label : ''}">
            <div class="mood-bar" style="height:${h}%;background:${mood ? mood.color : 'transparent'}"></div>
            <span class="mood-bar-day">${d.date.getDate()}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;

  // List all entries
  const allSorted = [...moods].sort((a,b) => b.time - a.time);
  const listHtml = `
    <div style="margin-top:1.5rem;">
      <h4 style="font-family:var(--font-display);font-weight:700;font-size:.95rem;margin-bottom:.75rem;">Semua Catatan (${moods.length})</h4>
      <div class="mood-entries-list">
        ${allSorted.map(e => {
          const mood = getMood(e.mood);
          return `
            <div class="mood-entry">
              <div class="mood-entry-emoji">${mood.emoji}</div>
              <div class="mood-entry-body">
                <div class="mood-entry-head">
                  <span class="mood-entry-name">${mood.label}</span>
                  <span class="mood-entry-time">${formatDate(e.time)} · ${formatTime(e.time)}</span>
                </div>
                <div class="mood-entry-reason">${escapeHtml(e.reason || '(tanpa alasan tertulis)')}</div>
                ${e.extra?.what || e.extra?.who || e.extra?.need ? `
                  <div style="margin-top:.4rem;font-size:.78rem;color:var(--text-muted);line-height:1.5;">
                    ${e.extra.what ? `<div>• Apa: ${escapeHtml(e.extra.what)}</div>` : ''}
                    ${e.extra.who ? `<div>• Siapa: ${escapeHtml(e.extra.who)}</div>` : ''}
                    ${e.extra.need ? `<div>• Butuh: ${escapeHtml(e.extra.need)}</div>` : ''}
                  </div>
                ` : ''}
                <div class="mood-entry-actions">
                  <button data-edit-mood="${e.id}"><i data-feather="edit-2"></i> Edit</button>
                  <button data-del-mood="${e.id}"><i data-feather="trash-2"></i> Hapus</button>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  // 7-day summary
  const weekAgo = Date.now() - 7 * 86400000;
  const monthAgo = Date.now() - 30 * 86400000;
  const week = moods.filter(e => e.time >= weekAgo);
  const month = moods.filter(e => e.time >= monthAgo);
  const summaryHtml = `
    <div class="stats-grid" style="margin-bottom:1.5rem;">
      <div class="stat-card">
        <div class="sc-icon"><i data-feather="calendar"></i></div>
        <div class="sc-value">${week.length}</div>
        <div class="sc-label">7 hari terakhir</div>
      </div>
      <div class="stat-card">
        <div class="sc-icon"><i data-feather="calendar"></i></div>
        <div class="sc-value">${month.length}</div>
        <div class="sc-label">30 hari terakhir</div>
      </div>
      <div class="stat-card">
        <div class="sc-icon"><i data-feather="bar-chart-2"></i></div>
        <div class="sc-value">${moods.length}</div>
        <div class="sc-label">Total catatan</div>
      </div>
      <div class="stat-card">
        <div class="sc-icon"><i data-feather="smile"></i></div>
        <div class="sc-value">${week.length ? getMood(week.sort((a,b) => b.time - a.time)[0].mood).emoji : '—'}</div>
        <div class="sc-label">Mood terakhir</div>
      </div>
    </div>
  `;

  return summaryHtml + `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;" class="mood-history-grid">
      ${calendarHtml}
      ${chartHtml}
    </div>
    <style>@media (max-width:768px){.mood-history-grid{grid-template-columns:1fr !important;}}</style>
    ${listHtml}
  `;
}

function renderMoodHistoryArea() {
  const c = $('#mood-history-container');
  if (!c) return;
  c.innerHTML = renderMoodHistory();
  feather.replace();

}

function bindMoodEntryActions(container) {
  $$('[data-edit-mood]', container).forEach(btn => {
    btn.addEventListener('click', () => {
      state.moodEditId = +btn.dataset.editMood;
      state.activeMoodForm = true;
      renderMoodFormArea();
      $('#mood-form-container')?.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
  $$('[data-del-mood]', container).forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Hapus catatan mood ini?')) return;
      const id = +btn.dataset.delMood;
      saveMoods(getMoods().filter(m => m.id !== id));
      toast('Catatan mood dihapus');
      renderMoodTodayArea();
      renderMoodHistoryArea();
    });
  });
}

function bindMoodFormEvents() {
  let selectedMood = state.moodEditId ? (getMoods().find(m => m.id === state.moodEditId)?.mood) : null;
  $$('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMood = btn.dataset.mood;
      $$('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      $('#mood-reason-step')?.classList.remove('hidden');
    });
  });
  $('#mood-cancel-btn')?.addEventListener('click', () => {
    state.moodEditId = null;
    state.activeMoodForm = false;
    renderMoodFormArea();
  });
  $('#mood-save-btn')?.addEventListener('click', () => {
    const reason = $('#mood-reason').value.trim();
    if (!selectedMood) { toast('Pilih mood terlebih dahulu'); return; }
    if (!reason) { toast('Ceritakan alasan atau pengalamanmu'); return; }
    const extra = {
      what: $('#mood-what')?.value.trim() || '',
      who: $('#mood-who')?.value.trim() || '',
      need: $('#mood-need')?.value.trim() || ''
    };
    let moods = getMoods();
    if (state.moodEditId) {
      const idx = moods.findIndex(m => m.id === state.moodEditId);
      if (idx >= 0) {
        moods[idx] = { ...moods[idx], mood: selectedMood, reason, extra };
      }
      toast('Mood diperbarui ✨');
    } else {
      moods.push({
        id: Date.now() + Math.random(),
        date: dateKey(new Date()),
        time: Date.now(),
        mood: selectedMood,
        reason,
        extra
      });
      toast('Mood hari ini tersimpan ✨');
    }
    saveMoods(moods);
    state.moodEditId = null;
    renderMoodFormArea();
    renderMoodTodayArea();
    renderMoodHistoryArea();
  });
}

function bindMoodHistoryEvents() {
  $$('[data-cal-prev]').forEach(b => b.addEventListener('click', () => {
    state.calendarMonth--;
    if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
    renderMoodHistoryArea();
  }));
  $$('[data-cal-next]').forEach(b => b.addEventListener('click', () => {
    state.calendarMonth++;
    if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
    renderMoodHistoryArea();
  }));
  $$('[data-cal-date]').forEach(b => b.addEventListener('click', () => {
    const date = b.dataset.calDate;
    const moods = getMoods().filter(m => m.date === date);
    if (moods.length === 0) return;
    const mood = getMood(moods.sort((a,b) => b.time - a.time)[0].mood);
    alert(`Catatan pada ${date}:\n\n${moods.map(m => {
      const mm = getMood(m.mood);
      return `${mm.emoji} ${mm.label} (${formatTime(m.time)})\n${m.reason || '(tanpa alasan)'}`;
    }).join('\n\n---\n\n')}`);
  }));
}

function renderJournalHistory() {
  let journals = storage.get('journals_v2', []);
  if (state.journalSearch) {
    const q = state.journalSearch.toLowerCase();
    journals = journals.filter(j => j.title.toLowerCase().includes(q) || j.text.toLowerCase().includes(q));
  }
  if (state.journalFilter) {
    const since = Date.now() - parseInt(state.journalFilter) * 86400000;
    journals = journals.filter(j => j.date >= since);
  }
  journals.sort((a,b) => b.date - a.date);

  return `
    <div class="card mb-2">
      <div style="display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;">

          <option value="30" ${state.journalFilter === '30' ? 'selected' : ''}>30 hari terakhir</option>
          <option value="90" ${state.journalFilter === '90' ? 'selected' : ''}>90 hari terakhir</option>
        </select>
      </div>
    </div>
    ${journals.length === 0 ? `
      <div class="empty-state">
        <span class="es-icon">📖</span>
        <p>${state.journalSearch || state.journalFilter ? 'Tidak ada catatan yang cocok.' : 'Belum ada catatan. Mulai tulis yang pertama di tab Jurnal Harian.'}</p>
      </div>
    ` : `
      <div class="journal-list">
        ${journals.map(j => `
          <div class="journal-card">
            <div class="journal-card-head">
              <h4>${escapeHtml(j.title)}</h4>

            <div class="journal-card-date"><i data-feather="calendar"></i> ${formatDate(j.date)} · ${formatTime(j.date)}</div>

    `}
  `;
}

  c.innerHTML = renderJournalPanel();

function bindJournalEvents() {
  // Daily
  $$('.prompt-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const ta = $('#journal-text');
      if (ta) {
        ta.value = (ta.value + (ta.value ? '\n\n' : '') + chip.dataset.prompt + '\n');
        ta.focus();
      }
    });
  });
  $('#journal-save-btn')?.addEventListener('click', () => {
    const title = $('#journal-title').value.trim();
    const text = $('#journal-text').value.trim();
    if (!title) { toast('Judul catatan wajib diisi'); return; }
    if (!text) { toast('Isi catatan wajib diisi'); return; }
    let journals = storage.get('journals_v2', []);
    if (state.journalEditId) {
      const idx = journals.findIndex(j => j.id === state.journalEditId);
      if (idx >= 0) journals[idx] = { ...journals[idx], title, text };
      toast('Catatan diperbarui ✨');
    } else {
      journals.unshift({ id: Date.now(), title, text, date: Date.now(), type:'daily' });
      toast('Catatan tersimpan ✍️');
    }
    storage.set('journals_v2', journals);
    state.journalEditId = null;
    renderJournalPanelArea();
  });
  $('#journal-cancel-btn')?.addEventListener('click', () => {
    state.journalEditId = null;
    renderJournalPanelArea();
  });
  // Gratitude
  $('#gratitude-save-btn')?.addEventListener('click', () => {
    const items = [];
    $$('[data-grat-idx]').forEach(inp => items.push(inp.value.trim()));
    if (!items.some(Boolean)) { toast('Isi minimal satu hal yang disyukuri'); return; }
    let gratitude = storage.get('gratitude_v2', []);
    const today = dateKey(new Date());
    const idx = gratitude.findIndex(g => g.date === today);
    if (idx >= 0) gratitude[idx] = { ...gratitude[idx], items };
    else gratitude.push({ id: Date.now(), date: today, items });
    storage.set('gratitude_v2', gratitude);
    toast('Rasa syukur tersimpan 💗');
    renderJournalPanelArea();
  });
  // History
  $('#journal-search')?.addEventListener('input', (e) => {
    state.journalSearch = e.target.value;
    const c = $('#journal-panel');
    c.innerHTML = renderJournalHistory();
    feather.replace();
    bindJournalEvents();
    // refocus search
    setTimeout(() => {
      const s = $('#journal-search');
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 0);
  });
  $('#journal-filter')?.addEventListener('change', (e) => {
    state.journalFilter = e.target.value;
    const c = $('#journal-panel');
    c.innerHTML = renderJournalHistory();
    feather.replace();
    bindJournalEvents();
  });
  $$('[data-edit-journal]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.journalEditId = +btn.dataset.editJournal;
      state.activeJournalTab = 'daily';
      $$('.journal-tab').forEach(t => t.classList.toggle('active', t.dataset.jtab === 'daily'));
      renderJournalPanelArea();
    });
  });
  $$('[data-del-journal]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Hapus catatan ini?')) return;
      const id = +btn.dataset.delJournal;
      storage.set('journals_v2', storage.get('journals_v2', []).filter(j => j.id !== id));
      toast('Catatan dihapus');
      renderJournalPanelArea();
    });
  });
}

function bindGoalEvents() {
  $('#goal-save-btn')?.addEventListener('click', () => {
    const name = $('#goal-name').value.trim();
    const desc = $('#goal-desc').value.trim();
    const category = $('#goal-category').value;
    const dueDate = $('#goal-due').value || null;
    if (!name) { toast('Nama tujuan wajib diisi'); return; }
    let goals = storage.get('goals_v2', []);
    if (state.goalEditId) {
      const idx = goals.findIndex(g => g.id === state.goalEditId);
      if (idx >= 0) goals[idx] = { ...goals[idx], name, desc, category, dueDate };
      toast('Tujuan diperbarui ✨');
    } else {
      goals.push({ id: Date.now(), name, desc, category, dueDate, done: false, createdAt: Date.now() });
      toast('Tujuan ditambahkan 🎯');
    }
    storage.set('goals_v2', goals);
    state.goalEditId = null;
    renderGoalsPanelArea();
    updateStatsAfterGoalChange();
  });
  $('#goal-cancel-btn')?.addEventListener('click', () => {
    state.goalEditId = null;
    renderGoalsPanelArea();
  });
  $$('[data-goal-id]').forEach(cb => {
    cb.addEventListener('change', () => {
      const goals = storage.get('goals_v2', []);
      const g = goals.find(x => x.id === +cb.dataset.goalId);
      if (g) {
        g.done = cb.checked;
        if (g.done) toast('Selamat! Tujuan tercapai 🎉');
      }
      storage.set('goals_v2', goals);
      renderGoalsPanelArea();
      updateStatsAfterGoalChange();
    });
  });
  $$('[data-edit-goal]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.goalEditId = +btn.dataset.editGoal;
      renderGoalsPanelArea();
    });
  });
  $$('[data-del-goal]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Hapus tujuan ini?')) return;
      storage.set('goals_v2', storage.get('goals_v2', []).filter(g => g.id !== +btn.dataset.delGoal));
      toast('Tujuan dihapus');
      renderGoalsPanelArea();
      updateStatsAfterGoalChange();
    });
  });
}

function bindChallengeEvents() {
  $$('[data-challenge-id]').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.challengeId;
      let done = new Set(storage.get('challenges_v2', []));
      if (cb.checked) { done.add(id); toast('Tantangan selesai! 🌟'); }
      else { done.delete(id); }
      storage.set('challenges_v2', [...done]);
      cb.closest('.challenge-item').classList.toggle('done', cb.checked);
      updateStatsAfterGoalChange();
    });
  });
}

function updateStatsAfterGoalChange() {
  const goals = storage.get('goals_v2', []);
  const challengesDone = storage.get('challenges_v2', []);
  const goalsDone = goals.filter(g => g.done).length;
  const goalsPct = goals.length ? Math.round((goalsDone / goals.length) * 100) : 0;
  const stats = $$('.stat-card .sc-value');
  if (stats[0]) stats[0].textContent = goalsDone;
  if (stats[1]) stats[1].textContent = goals.length;
  if (stats[2]) stats[2].textContent = challengesDone.length;
  if (stats[3]) stats[3].textContent = goalsPct + '%';
  const bar = $('.progress-bar-lg-fill');
  if (bar) bar.style.width = goalsPct + '%';
  const txt = $('.progress-bar-lg-fill')?.closest('.card')?.querySelector('p');
  if (txt) txt.textContent = `${goalsDone} dari ${goals.length} tujuan telah kamu capai. Terus melangkah! 🌱`;
}

const MEMORY_CONFIG = {
  easy: { cols:3, pairs:6, words:['Jujur','Berani','Sabar','Kreatif','Empatik','Peduli'] },
  medium: { cols:4, pairs:8, words:['Jujur','Berani','Sabar','Kreatif','Empatik','Peduli','Fokus','Tenang'] },
  hard: { cols:5, pairs:10, words:['Jujur','Berani','Sabar','Kreatif','Empatik','Peduli','Fokus','Tenang','Setia','Optimis'] }
};

function startMemoryGame(diff) {
  if (state.memoryTimer) clearInterval(state.memoryTimer);
  const cfg = MEMORY_CONFIG[diff];
  const deck = [...cfg.words, ...cfg.words].sort(() => Math.random() - 0.5);
  state.memoryState = {
    difficulty: diff, cfg, deck, flipped: [], matched: [],
    moves: 0, seconds: 0, combo: 0, maxCombo: 0, lock: false, result: null
  };
  renderGamePanelArea();
  state.memoryTimer = setInterval(() => {
    if (!state.memoryState || state.memoryState.result) return;
    state.memoryState.seconds++;
    const el = $('#mem-time');
    if (el) el.textContent = formatTimer(state.memoryState.seconds);
  }, 1000);
}

function flipMemoryCard(i) {
  const g = state.memoryState;
  if (!g || g.lock || g.result) return;
  if (g.flipped.includes(i) || g.matched.includes(i)) return;
  g.flipped.push(i);
  renderGamePanelArea();
  if (g.flipped.length === 2) {
    g.moves++;
    const [a, b] = g.flipped;
    if (g.deck[a] === g.deck[b]) {
      g.matched.push(a, b);
      g.combo++;
      g.maxCombo = Math.max(g.maxCombo, g.combo);
      g.flipped = [];
      renderGamePanelArea();
      if (g.matched.length === g.cfg.pairs * 2) {
        if (state.memoryTimer) clearInterval(state.memoryTimer);
        const optimal = g.cfg.pairs;
        const score = Math.max(50, 1000 - g.seconds * 3 - Math.max(0, g.moves - optimal) * 20 + g.maxCombo * 15);
        const best = storage.get('gameBest', { easy:0, medium:0, hard:0 });
        const isRecord = score > (best[g.difficulty] || 0);
        if (isRecord) { best[g.difficulty] = score; storage.set('gameBest', best); }
        g.result = { seconds: g.seconds, moves: g.moves, maxCombo: g.maxCombo, score, isRecord };
        renderGamePanelArea();
      }
    } else {
      g.combo = 0;
      g.lock = true;
      setTimeout(() => {
        if (!state.memoryState) return;
        g.flipped = [];
        g.lock = false;
        renderGamePanelArea();
      }, 700);
    }
  }
}

function renderGamePanelArea() {
  const c = $('#game-panel');
  if (!c) return;
  c.innerHTML = renderGamePanel();
  feather.replace();
  // Memory diff cards
  $$('[data-mem-diff]').forEach(btn => {
    btn.addEventListener('click', () => {
      const diff = btn.dataset.memDiff;
      if (state.memoryState && state.memoryState.difficulty === diff && !state.memoryState.result) return;
      startMemoryGame(diff);
    });
  });
  // Memory cards
  $$('[data-mem-i]').forEach(btn => {
    btn.addEventListener('click', () => flipMemoryCard(+btn.dataset.memI));
  });
  $('#mem-back-btn')?.addEventListener('click', () => {
    if (state.memoryTimer) clearInterval(state.memoryTimer);
    state.memoryState = null;
    renderGamePanelArea();
  });
  $('#mem-again-btn')?.addEventListener('click', () => {
    const diff = state.memoryState?.difficulty || 'easy';
    startMemoryGame(diff);
  });
  // Emotion quiz
  $$('[data-eq-opt]').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = EMOTION_QUIZ[state.emotionQuizIndex];
      const chosen = btn.dataset.eqOpt;
      if (chosen === q.correct) {
        state.emotionQuizScore++;
        btn.classList.add('correct');
      } else {
        btn.classList.add('wrong');
        $$('[data-eq-opt]').forEach(b => {
          if (b.dataset.eqOpt === q.correct) b.classList.add('correct');
        });
      }
      $$('[data-eq-opt]').forEach(b => b.disabled = true);
      const fb = $('#eq-feedback');
      if (fb) {
        fb.innerHTML = `
          <div class="eq-feedback">
            <strong>${chosen === q.correct ? '✅ Benar!' : '💡 Jawaban yang tepat: ' + q.correct}</strong><br>
            ${q.feedback}
          </div>
          <button class="btn btn-primary mt-2" id="eq-next-btn" style="width:100%;">
            ${state.emotionQuizIndex + 1 < EMOTION_QUIZ.length ? 'Soal Berikutnya' : 'Lihat Hasil'}
          </button>
        `;
        $('#eq-next-btn')?.addEventListener('click', () => {
          state.emotionQuizIndex++;
          renderGamePanelArea();
        });
      }
    });
  });
  $('#eq-restart-btn')?.addEventListener('click', () => {
    state.emotionQuizIndex = 0;
    state.emotionQuizScore = 0;
    renderGamePanelArea();
  });
  // Word of me
  $$('[data-word]').forEach(btn => {
    btn.addEventListener('click', () => {
      const w = btn.dataset.word;
      if (state.wordSelections.includes(w)) {
        state.wordSelections = state.wordSelections.filter(x => x !== w);
      } else {
        if (state.wordSelections.length >= 3) { toast('Maksimal 3 kata'); return; }
        state.wordSelections.push(w);
      }
      renderGamePanelArea();
    });
  });
  $('#word-reflect-btn')?.addEventListener('click', () => {
    if (state.wordSelections.length === 0) return;
    const c = $('#game-panel');
    const reflections = state.wordSelections.map(w => ({ word: w, q: WORD_REFLECTIONS[w] || 'Apa makna kata ini bagimu?' }));
    c.innerHTML = `
      <div class="card">
        <h3 style="font-family:var(--font-display);font-size:1.1rem;margin-bottom:.85rem;">Refleksi Kata Pilihanmu</h3>
        <div class="word-reflection-list">
          ${reflections.map(r => `
            <div class="word-reflection-item">
              <div class="wr-word">${escapeHtml(r.word)}</div>
              <p style="font-size:.88rem;color:var(--text-secondary);line-height:1.65;">${escapeHtml(r.q)}</p>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;gap:.5rem;margin-top:1.25rem;flex-wrap:wrap;">
          <button class="btn btn-primary" id="word-save-btn"><i data-feather="save"></i> Simpan Pilihan</button>
          <button class="btn btn-ghost" id="word-back-btn">Kembali</button>
        </div>
      </div>
    `;
    feather.replace();
    $('#word-save-btn')?.addEventListener('click', () => {
      storage.set('wordOfMe_v2', { words: [...state.wordSelections], timestamp: Date.now() });
      toast('Refleksi tersimpan 💗');
      state.wordSelections = [];
      renderGamePanelArea();
    });
    $('#word-back-btn')?.addEventListener('click', () => renderGamePanelArea());
  });
}

  applyTheme(storage.get('theme', 'light'));
  migrateData();
  feather.replace();
  onRouteChange();
});

// Fallback if DOMContentLoaded already fired
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  applyTheme(storage.get('theme', 'light'));
  migrateData();
  feather.replace();
  if (!document.querySelector('.page.active')) onRouteChange();
}
</script>
</body>
